# tmux.conf --- provisioned onto remote hosts by config-remote.el
# Installed to a host's ~/.tmux.conf via `my/remote-provision-tmux' (offered on
# first connect). Persistence lives in tmux; the Ghostel buffer attaching to it
# is disposable.

set  -g mouse on                       # trackpad scroll -> tmux copy-mode
set  -g history-limit 50000            # deep scrollback (tmux owns it, not Ghostel)
setw -g mode-keys vi                   # vi keys in copy-mode
set  -g default-terminal "tmux-256color"
set  -sg escape-time 10                # don't swallow ESC (matters for Emacs/vi)
